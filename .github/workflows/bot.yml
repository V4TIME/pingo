name: Discord V4 Bot

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes for uptime
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run V4 Bot
        run: node src/v4bot.js
        env:
          BOT_TOKEN_1: ${{ secrets.BOT_TOKEN_1 }}
          BOT_TOKEN_2: ${{ secrets.BOT_TOKEN_2 }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          
      - name: Keep Alive Check
        if: failure()
        run: |
          echo "Bot failed to start or exited"
          echo "Checking if tokens are properly set..."
          if [ -z "${{ secrets.BOT_TOKEN_1 }}" ]; then
            echo "ERROR: BOT_TOKEN_1 not found in secrets"
            exit 1
          fi
        env:
          BOT_TOKEN_1: ${{ secrets.BOT_TOKEN_1 }}
