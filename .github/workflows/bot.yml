name: Discord Bot Keeper
on:
  schedule:
    - cron: '*/1 * * * *'  # Every minute
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Discord Gateway
        run: |
          curl -s -H "Authorization: Bot ${BOT_TOKEN_1}" "https://discord.com/api/v10/gateway/bot" || echo "Ping failed"
        env:
          BOT_TOKEN_1: ${{ secrets.BOT_TOKEN_1 }}